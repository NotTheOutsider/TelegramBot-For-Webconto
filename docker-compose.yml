services:
  api:
    image: nottheoutsider/webc_bot_api:1.0
    command: ["python", "-m", "services.api.api"]
    ports:
      - "5000:5000"  # API on port 5000
    environment:
      - URI=${URI}
      - CHAT_ID=${CHAT_ID}
      - TOKEN=${TOKEN}
    networks:
      - app-network

  bot:
    image: nottheoutsider/webc_tgbot:1.1  # Ensure this image exists
    command: ["python", "-m", "services.bot.bot"]
    depends_on:
      - api
    # Remove ports unless bot needs external access
    environment:
      - URI=${URI}
      - CHAT_ID=${CHAT_ID}
      - TOKEN=${TOKEN}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge